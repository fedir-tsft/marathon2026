version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - cd "$CODEBUILD_SRC_DIR/aqa/restaurant-aqa-framework" && npm ci
      - cd "$CODEBUILD_SRC_DIR/aqa/restaurant-aqa-framework" && npx playwright install --with-deps chromium
  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/aqa/restaurant-aqa-framework" && mkdir -p test-results
      - cd "$CODEBUILD_SRC_DIR/aqa/restaurant-aqa-framework" && npm run typecheck
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/aqa/restaurant-aqa-framework" && npx playwright test

reports:
  restaurant-aqa-junit:
    files:
      - junit.xml
    base-directory: aqa/restaurant-aqa-framework/test-results
    file-format: JUNITXML

artifacts:
  files:
    - aqa/restaurant-aqa-framework/playwright-report/**/*
    - aqa/restaurant-aqa-framework/test-results/**/*
  discard-paths: no
